name: SonarQube Cloud (.NET)

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SonarScanner for .NET (dotnet tool)
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin             /k:"${{ vars.SONAR_PROJECT_KEY }}"             /o:"${{ vars.SONAR_ORG }}"             /d:sonar.host.url="https://sonarcloud.io"             /d:sonar.token="${SONAR_TOKEN}"             /d:sonar.cs.analyzeRazorCode=true             /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx"             /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore SonarLab.sln

      - name: Build
        run: dotnet build SonarLab.sln -c Release --no-restore

      - name: Test (with coverage)
        run: |
          dotnet test SonarLab.sln -c Release --no-build             --logger "trx"             /p:CollectCoverage=true             /p:CoverletOutputFormat=opencover             /p:CoverletOutput=TestResults/coverage.opencover.xml

      - name: Sonar end
        if: ${{ always() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
